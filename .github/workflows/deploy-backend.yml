name: Deploy Backend to Oracle Cloud

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch: # Allows manual click-to-deploy from GitHub website

jobs:
  deploy:
    name: Deploy to Oracle Server
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to Oracle Cloud via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            echo "🚀 Starting backend deployment on Oracle Cloud..."
            cd ~/Aradhna-Marg
            git pull origin main
            cd backend
            npm install
            export NODE_OPTIONS="--max-old-space-size=2048"
            npm run build
            pm2 restart aradhna-backend
            pm2 save
            echo "✅ Backend successfully updated and restarted!"
